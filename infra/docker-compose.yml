version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: refinely_db
    environment:
      POSTGRES_USER: refinely_user
      POSTGRES_PASSWORD: refinely_secret
      POSTGRES_DB: refinely_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refinely_user -d refinely_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
